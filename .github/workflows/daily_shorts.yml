name: Daily YouTube Shorts

on:
  schedule:
    # 11:00 and 20:15 Asia/Kolkata (IST), expressed in UTC for GitHub Actions.
    - cron: "30 5 * * *"
    - cron: "45 14 * * *"
  workflow_dispatch:

concurrency:
  group: youtube-shorts-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      DRY_RUN: "false"
      YOUTUBE_PRIVACY_STATUS: public
      HISTORY_BACKEND: local
      PUBLICATION_CHANNEL: ${{ vars.PUBLICATION_CHANNEL || 'youtube-channel' }}
      PUBLICATION_SLOT: ${{ github.event.schedule || 'manual' }}
      OUTPUT_DIR: output
      WORK_DIR: work
      STATE_DIR: state

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install package
        run: pip install -e .

      - name: Run Shorts pipeline
        run: python -m shorts_pipeline.main

      - name: Upload rendered MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-short-${{ github.run_id }}
          path: output/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Persist ledger and history
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state/history.json state/publication_ledger.json state/upload-receipt-*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "chore: persist Shorts publication state [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "History push failed; refreshing the branch before retry ${attempt}."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          echo "Unable to persist publication state after three push attempts."
          exit 1
