name: Daily Autonomous YouTube Shorts Generator

on:
  schedule:
    # 11:30 AM IST test trigger (06:00 UTC) + Daily 11:04 AM & 8:04 PM IST
    - cron: '0 6 * * *'
    - cron: '34 5 * * *'
    - cron: '34 14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🎬 Install FFmpeg & yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🚀 Run Daily Video Generator & YouTube Auto-Uploader
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REDIRECT_URI: ${{ secrets.YOUTUBE_REDIRECT_URI }}
          TTS_PROVIDER: ${{ secrets.TTS_PROVIDER }}
          DEFAULT_VOICE: ${{ secrets.DEFAULT_VOICE }}
          DEFAULT_ASPECT_RATIO: ${{ secrets.DEFAULT_ASPECT_RATIO }}
          PORT: ${{ secrets.PORT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: npm run generate:daily -- --upload-youtube

      - name: 💾 Persist Posted Story History
        run: |
          git config --global user.name "GitHub Daily Automation Bot"
          git config --global user.email "bot@github.com"
          git pull origin main --rebase || true
          git add content/posted_stories.json temp/posted_stories.json || true
          git commit -m "auto: update posted stories history [skip ci]" || true
          git push origin main || true
